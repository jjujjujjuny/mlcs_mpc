# ═══════════════════════════════════════════════════════════════════
#  차량 물리 파라미터 + MPC 튜닝
#
#  ⚠ 아래 "미측정" 표시가 붙은 값은 **아직 이 차로 재지 않은 값**이다.
#    f1tenth 표준 섀시 / 26-jetson 2호차 값을 출발점으로 빌려왔다.
#    재기 전까지는 저속(1~1.5 m/s)으로만 주행하세요.
#
#  측정 순서 — 뒤 단계가 앞 단계에 의존한다:
#    ① 조향 중립      ros2 run mlcs_mpc calibrate -p mode:=neutral
#    ② 속도 게인      ros2 run mlcs_mpc calibrate -p mode:=speed  -p value:=1.5
#    ③ 조향 게인      ros2 run mlcs_mpc calibrate -p mode:=steer  -p value:=0.2
#    ④ 휠베이스       줄자 (앞바퀴축 ~ 뒷바퀴축 중심)
#    ⑤ 최대 조향각    기구 스토퍼까지 돌려서 확인
#
#  ②가 틀리면 그 위 전부가 틀린다 — MPC 예측이 v 에 비례하기 때문.
#  자세한 절차: docs/CALIBRATION.md
# ═══════════════════════════════════════════════════════════════════

/**:
  ros__parameters:

    # ── 차량 기구 ────────────────────────────────────────────────────
    # ✅ 2026-09-18 줄자 실측. 정합성 확인: 0.10 + 0.33 + 0.075 = 0.505 ✓
    #    전장 0.505 / 전폭 0.27(바퀴 바깥) / 윤거 0.23(바퀴 중심)
    #    앞오버행 0.10 (앞축~앞범퍼) / 뒤오버행 0.075
    wheelbase: 0.33         # ✅ 실측 — 앞바퀴축 중심 ~ 뒷바퀴축 중심
    max_steer: 0.40         # ✅ 실측 (2026-09-30) — ±0.42 명령 시 실제 +0.398 / -0.402 rad (약 22.9°)
    max_steer_rate: 3.2     # rad/s. 서보 속도 한계.
                            # f1tenth_stack 의 max_servo_speed 와 같은 값

    # ── 속도 한계 ────────────────────────────────────────────────────
    # ★ 캘리브레이션 전에는 낮게 두세요. 예측이 틀린 상태에서 빠르면
    #   MPC 가 경로를 벗어나는 것을 못 잡습니다.
    max_speed: 2.0          # 캘리브레이션 후 단계적으로 올릴 것
    min_speed: 0.0
    max_accel: 2.0
    max_decel: 3.0

    # ── 타이어 / 노면 ────────────────────────────────────────────────
    mu: 0.35                # 미측정 — 노면 마찰계수.
                            # 속도 프로파일 v=sqrt(mu*g/kappa) 에 쓰인다
    # ✅ 2026-10-02 저울 실측
    #    앞축 하중 1400 g / 뒤축 1685 g / 전체 3097 g
    #    검산: 1400+1685 = 3085 g vs 전체 3097 g → −12 g (−0.39%) ✓
    #
    #    무게중심은 **뒤쪽**에 있다 (앞 45.2% : 뒤 54.4%).
    #      l_f = L × F_r/(F_f+F_r) = 0.33 × 0.5462 = 0.1802
    #      l_r = L × F_f/(F_f+F_r) = 0.33 × 0.4538 = 0.1498
    #    ★ 분자가 교차한다 — 앞축에서 CoG 까지 거리(l_f)는 **뒤축 하중**에
    #      비례한다. 뒤가 무거우면 CoG 가 뒤로 가므로 l_f 가 커진다.
    #
    #    이전 값(0.176/0.144)은 26-jetson 에서 빌려온 것이라 합이 0.320 으로
    #    실측 휠베이스 0.33 과 안 맞았다. 이제 합이 정확히 0.3300 이다.
    mass: 3.097             # ✅ 실측 (kg)
    lf: 0.1802              # ✅ 실측 — 앞축 ~ 무게중심
    lr: 0.1498              # ✅ 실측 — 뒤축 ~ 무게중심   (lf+lr = 0.3300 = L)
                            # (lf, lr, mass 는 동역학 모델로 갈 때 쓴다)

    # ── 요 관성모멘트 ────────────────────────────────────────────────
    #
    #  ⚠ 추정값이다 (안 재고 계산). 다만 **독립적인 두 방법이 1% 안에서
    #    일치**해서 자릿수를 틀릴 일은 없다 (2026-10-02):
    #
    #      균일 평판   m(a²+b²)/12 = 3.097·(0.505²+0.27²)/12 = 0.0846
    #      동적지수 1   m·lf·lr     = 3.097·0.1802·0.1498     = 0.0836
    #
    #    회전반경 k = sqrt(I/m) = 0.164 m — 전장(0.505)의 33%. 타당하다.
    #
    #  ★ 논문 기본값 0.46 을 베껴 쓰지 말 것.
    #    5.1 kg 에서 0.46 이면 k = 0.300 m 인데, 길이 0.505 m 물체의
    #    **이론 최대** k 는 a/2 = 0.253 m 다 (질량이 양 끝에 몰린 막대).
    #    물리적으로 불가능한 값이므로 측정치가 아니라 학습 파라미터의
    #    초기값이다 — single_track_params.py 의 default_params_tensor 에
    #    I_z 가 들어 있고, HyperPM 이 예측하는 10개 중 하나다.
    #    같은 식으로 논문 차를 추정하면 5.1·0.115·0.215 = 0.126 이다.
    #
    #  제대로 재려면 이선(bifilar) 진자 — docs/CALIBRATION.md 참고.
    #    I_z = m·g·(d/2)²·T² / (4π²·Ls)
    #    줄 간격 d=0.10 m, 줄 길이 Ls=0.8 m 이면 주기가 약 5.9 초라
    #    스톱워치로 10회 재면 오차 1% 아래로 떨어진다.
    I_z: 0.084              # 추정 (kg·m²) — 저속에서는 영향이 작고,
                            # HyperPM 이 데이터에서 다시 잡는다

    # ── 차체 치수 (safety_node 여유·시각화용) ────────────────────────
    track_width:   0.23     # ✅ 실측 — 좌우 바퀴 중심 간
    vehicle_width: 0.27     # ✅ 실측 — 바퀴 바깥 기준 전폭
    vehicle_length: 0.505   # ✅ 실측 — 전장
    front_overhang: 0.10    # ✅ 실측 — 앞축 중심 ~ 앞범퍼
    rear_overhang:  0.075   # ✅ 실측 — 뒤축 중심 ~ 뒷범퍼

    # ── MPC 튜닝 ─────────────────────────────────────────────────────
    N: 20                   # 예측 스텝 수
    dt: 0.05                # 스텝 간격 → 예측 구간 = N*dt = 1.0초
                            # ★ N 을 키우면 먼 코너를 보지만 계산이 선형으로 는다.
                            #   Jetson 에서 /mpc/solve_time 을 보고 정하세요.
                            #   20Hz 주기면 50ms 안에 끝나야 합니다.
    control_rate: 20.0      # 제어 주기 (Hz). dt 와 맞추는 것이 기본.

    # 비용 가중치 — 상대비만 의미가 있다 (전체를 2배 해도 해는 같다)
    w_pos: 10.0             # 경로 추종. 키우면 경로에 딱 붙지만 조향이 급해진다
    w_psi: 2.0              # 헤딩 정렬
    w_v: 2.0                # 속도 추종
    w_a: 0.05               # 가속 입력 억제. 키우면 부드럽지만 굼뜨다
    w_ddelta: 0.5           # 조향 변화 억제. ★ 조향 떨림이 있으면 이걸 키우세요
    w_terminal: 20.0        # 예측 끝점 가중. 작으면 예측 끝에서 경로를 놓친다

    max_iter: 3             # iLQR 반복 횟수.
                            # ★ warm start 덕에 3 이면 8 과 결과가 같다
                            #   (Levine 한 바퀴 측정: 둘 다 횡오차 4.0cm,
                            #    24.3ms → 9.9ms). 늘려도 정확도는 안 오른다.
    backend: 'ilqr'         # 'ilqr' (의존성 없음) | 'acados' (미구현)

    # ── 경로 ─────────────────────────────────────────────────────────
    target_speed: 1.5       # 목표 속도. 곡률에 따라 이보다 낮아진다
    curvature_slowdown: 1.5 # 곡선에서 추가 감속 정도
    closed_loop: true       # 경로가 닫힌 고리인가

    # ── 안전 ─────────────────────────────────────────────────────────
    state_timeout: 0.2      # 이 시간 동안 상태가 안 오면 정지
    require_enable: true    # /mpc/enabled=true 를 받아야 출발
    bench: false            # ★ true 면 속도를 항상 0 으로 발행 (거치대 시험용)
