# ═══════════════════════════════════════════════════════════════════
#  OptiTrack Motive (NatNet) 연동 설정
#
#  전제: 다른 PC 에서 Motive 가 돌고 있고, 같은 네트워크의 어딘가에서
#        natnet_ros2 가 NatNet → ROS 2 변환을 하고 있다.
#        (Jetson 에서 직접 돌려도 되고 별도 PC 에서 돌려도 된다 —
#         ROS_DOMAIN_ID 만 같으면 토픽이 보인다)
# ═══════════════════════════════════════════════════════════════════

/**:
  ros__parameters:

    # ★ Motive 의 RigidBody 이름에 따라 토픽이 정해진다.
    #   Motive 에서 강체 이름을 'car' 로 만들었다면 아래가 맞다.
    #   실제 이름은 `ros2 topic list | grep natnet` 으로 확인하세요.
    mocap_topic: '/natnet_ros/car/pose'

    map_frame: 'map'
    base_frame: 'base_link'
    publish_tf: true

    # ── 안전 ─────────────────────────────────────────────────────────
    # 100Hz 스트림 기준 0.2s = 20프레임 연속 유실.
    # 라이다가 없어서 mocap 이 끊기면 위치를 전혀 모르므로 즉시 정지한다.
    timeout: 0.2

    # ── 칼만 필터 (속도 추정) ────────────────────────────────────────
    # q_pos/q_vel 을 키우면 측정을 더 믿고(빠른 반응, 노이즈 통과),
    # 줄이면 모델을 더 믿는다(부드럽지만 지연).
    # r_meas 는 mocap 측정 노이즈 분산 — OptiTrack 은 매우 작다 (mm급).
    q_pos: 0.01
    q_vel: 1.0
    r_meas: 0.0001

    # ── 강체 원점 → 차량 기준점 보정 ─────────────────────────────────
    # Motive 에서 만든 강체의 원점이 차량 뒤축 중심과 다르면 그 차이를 적는다.
    # MPC 의 운동학 모델은 **뒤축 중심** 기준이다.
    #
    # 측정법: 차를 정지시킨 뒤 mocap 이 보고하는 위치와 실제 뒤축 중심의
    #        차이를 차체 좌표계(x=전방, y=좌)로 재서 적는다.
    #        모르면 0 으로 두고, 원을 그려보며 조정해도 된다 —
    #        offset 이 틀리면 선회 시 위치가 원을 그리며 흔들린다.
    offset_x: 0.0
    offset_y: 0.0
    yaw_offset: 0.0
