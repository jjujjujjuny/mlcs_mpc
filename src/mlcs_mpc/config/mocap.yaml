# ═══════════════════════════════════════════════════════════════════
#  OptiTrack Motive (NatNet) 연동 설정
#
#  전체 절차: docs/MOCAP_SETUP.md
#
#  ★ 젯슨이 무선이면 Motive 의 Transmission Type 을 반드시 **Unicast** 로.
#    Multicast 는 무선 AP 에서 걸러져 "연결은 됐는데 데이터가 0Hz" 인
#    상태가 되고, 에러가 안 나서 원인을 찾기 어렵다.
# ═══════════════════════════════════════════════════════════════════

/**:
  ros__parameters:

    # ★ natnet_ros2 는 **/<RigidBody이름>/pose** 로 발행한다.
    #   Motive 에서 강체 이름을 'car' 로 만들었다면 /car/pose 다.
    #   실제 이름을 반드시 확인하고 맞추세요:
    #       ros2 topic list | grep -i pose
    mocap_topic: '/car/pose'

    map_frame: 'map'
    base_frame: 'base_link'
    publish_tf: true

    # ── 안전 ─────────────────────────────────────────────────────────
    # 100Hz 스트림 기준 0.2s = 20프레임 연속 유실.
    # 라이다가 없어서 mocap 이 끊기면 위치를 전혀 모르므로 즉시 정지한다.
    timeout: 0.2

    # ── 칼만 필터 (속도 추정) ────────────────────────────────────────
    # q_pos/q_vel 을 키우면 측정을 더 믿고(빠른 반응, 노이즈 통과),
    # 줄이면 모델을 더 믿는다(부드럽지만 지연).
    # r_meas 는 mocap 측정 노이즈 분산 — OptiTrack 은 매우 작다 (mm급).
    q_pos: 0.01
    q_vel: 1.0
    r_meas: 0.0001

    # ── 강체 원점 → 차량 기준점 보정 ─────────────────────────────────
    #
    #  ■ 이 차량의 지그 배치 (2026-09-18 실측)
    #
    #     뒤축          앞축        지그 기둥끝
    #      │             │            │
    #   ───●─────────────●────────────●──
    #     0.0          +0.33       +0.45     [m, 뒤축 기준]
    #     ▲             ▲
    #     │             └ Y자 중심 마커 = 앞축 중심 위
    #     └ MPC 기준점 (운동학 자전거 모델)
    #
    #     휠베이스 0.33 / 전장 0.505 / 전폭 0.27 / 윤거 0.23
    #     앞오버행 0.10 / 뒤오버행 0.075
    #     지그 기둥끝은 Y자 중심보다 12cm 앞 → 앞범퍼보다 2cm 돌출
    #
    #  ■ offset_x 는 Motive 의 **Pivot 을 어디 뒀느냐**로 정해진다
    #
    #     Pivot = Y자 중심 마커(앞축 위)  →  offset_x: -0.33
    #     Pivot = 기둥 끝 마커            →  offset_x: -0.45
    #     Pivot = 마커 8개 무게중심(기본) →  -0.33 ~ -0.45 사이
    #        (기둥쪽 3개가 앞에 몰려 있어 앞으로 치우친다)
    #
    #     ★ Motive 에서 Pivot 을 **Y자 중심 마커로 지정**하는 것을 권한다.
    #       그러면 offset_x = -(휠베이스) = -0.33 으로 명확해진다.
    #       기본값(무게중심)으로 두면 정확한 값을 알기 어렵다.
    #
    #  ■ 보정 안 하면 (반경 1m 선회 기준)
    #       앞축 위 마커 : 마커가 1.053m 를 돈다 → 5.3cm 오차
    #       기둥 끝 마커 : 1.097m              → 9.7cm 오차
    #     MPC 경로추종 목표가 5cm 인데 그만큼 틀어진다.
    #
    #  ■ 확인: 차를 제자리 회전시키며
    #       ros2 topic echo /mpc/state --field pose.pose.position
    #     보정 전엔 원을 그리고, 보정 후엔 거의 제자리여야 한다.
    #
    #  자동 측정:  ./drive.sh mocapcal spin
    # Motive 에서 만든 강체의 원점이 차량 뒤축 중심과 다르면 그 차이를 적는다.
    # MPC 의 운동학 모델은 **뒤축 중심** 기준이다.
    #
    # 측정법: 차를 정지시킨 뒤 mocap 이 보고하는 위치와 실제 뒤축 중심의
    #        차이를 차체 좌표계(x=전방, y=좌)로 재서 적는다.
    #        모르면 0 으로 두고, 원을 그려보며 조정해도 된다 —
    #        offset 이 틀리면 선회 시 위치가 원을 그리며 흔들린다.
    # ★ Pivot 을 Y자 중심 마커(앞축 위)로 잡았을 때의 값.
    #   Motive 의 Pivot 위치를 확인하고 위 표에서 맞는 값을 쓰세요.
    offset_x: -0.33
    offset_y: 0.0       # Y자를 좌우 대칭으로 붙였으므로 0
    yaw_offset: 0.0     # ./drive.sh mocapcal straight 로 확인
