# ═══════════════════════════════════════════════════════════════════
#  경계 안전장치
#
#  ⚠ 아래 값은 **예시**다. 반드시 실험실 mocap 좌표계 실측값으로 바꿔라.
#
#  재는 법: 차를 실험 공간 네 귀퉁이에 놓고
#      ros2 topic echo /mpc/state --field pose.pose.position
#    로 좌표를 읽는다. 그 값보다 안쪽으로 경계를 잡는다.
#
#  ⚠ 이것은 소프트웨어 안전장치다. 노드가 죽으면 같이 죽는다.
#    하드웨어 킬스위치를 반드시 손에 들고 실험하세요.
# ═══════════════════════════════════════════════════════════════════

/**:
  ros__parameters:
    enabled: true

    # 실험 공간 경계 (mocap 좌표계, m) — ★ 실측값으로 교체 필수
    x_min: -3.0
    x_max: 3.0
    y_min: -3.0
    y_max: 3.0

    margin: 0.3         # 경계 안쪽 여유. 차 길이의 절반 이상 권장
    lookahead: 0.7      # 이 시간 뒤 예측 위치가 경계 밖이면 미리 정지
                        # 제동거리를 생각하면 속도가 빠를수록 키워야 한다
    max_speed: 3.0      # 이 속도를 넘으면 비상 정지 (폭주 감지)
