# ═══════════════════════════════════════════════════════════════════
#  로지텍 F710 조이스틱 설정
#
#  ★ 뒷면 Mode 버튼은 **OFF** (LED 꺼진 상태)로 쓴다.
#    Mode ON 이면 D-pad 와 L스틱이 서로 바뀌어 축 번호가 전부 달라진다.
#
#  ★ 앞면 스위치는 **X** (D 아님). D 모드는 축 배치가 다르다.
#
#  축·버튼 번호가 안 맞으면 아래로 실제 값을 확인하세요:
#      ros2 topic echo /joy
#    버튼을 하나씩 누르며 buttons 배열의 몇 번째가 1 이 되는지,
#    스틱을 밀며 axes 배열의 몇 번째가 변하는지 보면 된다.
# ═══════════════════════════════════════════════════════════════════

/**:
  ros__parameters:

    # ── 축·버튼 배치 (F710, Mode OFF, X 모드) ───────────────────────
    axis_steer:  0      # L스틱 좌우
    axis_speed:  5      # RT 트리거
    btn_reverse: 5      # RB — 누르는 동안 후진
    btn_toggle:  4      # LB — 수동↔자율 토글
    btn_estop:   7      # START — 비상 정지

    # ── 부호 ────────────────────────────────────────────────────────
    # ⚠ 미확인 — 첫 주행에서 확인하고 고칠 것.
    #
    # ★ 속도 부호가 틀린 상태에서 조향 부호를 판단하지 마세요.
    #   26-jetson 2호차가 이 함정에 빠졌습니다: 차가 후진 중에는 스틱을
    #   좌로 밀어도 앞머리가 우로 도는 것처럼 보입니다(후진 주차와 같은 감각).
    #   그래서 steer_invert 를 true 로 잘못 잡았고, 나중에 속도 부호를
    #   고치자 이중 반전이 되어 좌우가 또 바뀌었습니다.
    #
    #   순서: ① 전진/후진이 맞는지 먼저 확인 → ② 그 다음 좌/우 확인
    steer_invert: false
    speed_invert: false

    # ★ 이 값은 "초기 추정" 일 뿐이고, 기동 직후 0.4초간 RT 축을 재서
    #   자동으로 덮어씁니다. 기동할 때 RT 에서 손을 떼고 계세요.
    trigger_invert: true

    # ── 감도 ────────────────────────────────────────────────────────
    trigger_deadzone: 0.05   # 트리거 유격 (0~1 정규화 기준)
    trigger_expo:     1.0    # 1.0 = 완전 선형. >1 이면 저속 구간이 완만해짐
    steer_deadzone:   0.08   # 스틱 중립 유격

    # ── 상한 ────────────────────────────────────────────────────────
    # ★ 캘리브레이션 전에는 낮게. docs/CALIBRATION.md 를 끝낸 뒤 올리세요.
    max_speed: 1.5
    max_steer: 0.36

    # ── 안전 ────────────────────────────────────────────────────────
    # /joy 가 이만큼 끊기면 속도 0 을 20Hz 로 강제 발행한다 (0 = 끔).
    # ★ 끄지 마세요. VESC 는 새 명령이 없으면 마지막 속도를 유지하므로,
    #   발행을 멈추는 것만으로는 차가 서지 않습니다.
    #   0.3s = joy 20~50Hz 기준 6~15 프레임 — 무선 순간 끊김에는 안 걸리고
    #   진짜 단절에는 확실히 걸리는 값.
    joy_timeout: 0.3

    allow_toggle: true    # LB 로 수동↔자율. mpc_node 없이 쓸 땐 false
    start_auto:   false   # ★ 항상 수동으로 시작한다
    debug:        false
