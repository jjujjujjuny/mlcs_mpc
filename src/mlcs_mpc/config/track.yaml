# ═══════════════════════════════════════════════════════════════════
#  track.yaml — 지금 달릴 트랙
#
#  ★ 트랙을 바꾸려면 이 파일의 waypoint_file 한 줄만 고치면 된다.
#    파일명만 적는다 — waypoints/ 안에서 알아서 찾는다 (path_manager.resolve).
#    절대경로를 적으면 장비마다 달라져서 설정을 공유할 수 없다.
#
#  ■ 읽는 순서 (뒤가 앞을 덮는다)
#
#      vehicle.yaml / stanley.yaml   차량 제원, 제어 게인
#      safety.yaml                   기본 경계
#      track.yaml                    ← 이 파일. 트랙마다 다른 것만
#      런치 인자                     ← 한 번만 다르게 해볼 때
#
#    그래서 여기에는 **트랙이 바뀌면 같이 바뀌는 것만** 둔다.
#    게인(k_e 등)은 차의 성질이지 트랙의 성질이 아니므로 stanley.yaml 에 둔다.
#
#  ■ 새 트랙을 추가할 때
#
#      1. waypoints/ 에 CSV 를 넣는다 (# x,y 헤더, 한 줄에 한 점)
#         DeepRacer 트랙이면:  ros2 run mlcs_mpc import_track ...
#      2. 아래 waypoint_file 을 그 파일명으로 바꾼다
#      3. ./drive.sh trackinfo 로 기하를 확인한다
#         — 특히 "안전 여유" 가 횡오차보다 큰지 본다
#      4. colcon build 는 필요 없다 (--symlink-install)
# ═══════════════════════════════════════════════════════════════════

/**:
  ros__parameters:

    # ── 어떤 트랙 ────────────────────────────────────────────────────
    waypoint_file: 'track_5.csv'
    closed_loop: true        # 폐곡선이면 끝점에서 시작점으로 이어 붙인다

    # ── 이 트랙에서의 속도 ───────────────────────────────────────────
    # ★ 첫 주행은 낮게. 한 바퀴 제대로 돌면 올린다.
    #   v_ref 는 여기에 곡률 기반 감속(curvature_slowdown)이 곱해져 정해지므로,
    #   실제 코너 속도는 이 값보다 낮게 나온다.
    #
    #   track_5 기준: target_speed 0.7 → v_ref 0.32 ~ 0.70 m/s
    target_speed: 0.7

    # ── 이 트랙에서의 안전 경계 ──────────────────────────────────────
    #
    #  ★ 경계는 **mocap 좌표계** 기준이다. 트랙이 바뀌면 같이 봐야 한다.
    #
    #  safety_node 는 두 가지를 본다 (safety_node.py:97~108):
    #     ① 현재 위치가  [min+margin, max-margin]  안인가
    #     ② lookahead 초 뒤 예측 위치가  [min, max]  안인가  (margin 없음)
    #
    #  ■ track_5 실측 (2026-09-23)
    #
    #     트랙 범위   x [-1.74, 1.34]   y [-2.16, 1.76]
    #     ①의 여유    최소 34 cm  @ y=-2.16 (트랙 남쪽 끝)
    #     ②의 여유    최소 82 cm
    #
    #     즉 **횡오차가 34cm를 넘으면 safety 가 차를 세운다.** 차가 잘 도는데
    #     남쪽 코너에서 갑자기 서면 게인 문제가 아니라 이것부터 의심할 것.
    #     로그에 "경계 이탈 (x=..., y=...)" 이 찍힌다.
    #
    #     첫 주행은 margin 을 그대로 두고 실제로 걸리는지 본다. 미리 낮추면
    #     안전장치를 무력화하는 것부터 하는 셈이다. 걸리면 그때 0.3 으로.
    x_min: -3.0
    x_max: 3.0
    y_min: -3.0
    y_max: 3.0
    margin: 0.5
