# ═══════════════════════════════════════════════════════════════════
#  Stanley 경로 추종 설정
#
#  MPC 전에 배관(mocap → 제어 → 구동)을 검증하는 용도.
#  게인이 사실상 2개뿐이라 "어디가 문제인지" 를 가리기 쉽다.
# ═══════════════════════════════════════════════════════════════════

/**:
  ros__parameters:

    # ── 차량 (vehicle.yaml 과 같아야 한다) ───────────────────────────
    wheelbase: 0.33         # ✅ 실측
    max_steer: 0.36         # 미측정 — 기구 스토퍼 확인 필요
    max_steer_rate: 3.2

    # ── 속도 ────────────────────────────────────────────────────────
    max_speed: 4.5
    min_speed: 0.7
    target_speed: 3.0       # ★ 첫 주행은 낮게. 잘 돌면 올린다
    curvature_slowdown: 1.5
    mu: 0.35

    # ── Stanley 게인 ────────────────────────────────────────────────
    # k_e: 횡오차를 얼마나 세게 잡는가.
    #      track_5 시뮬(실차 노이즈+지연 포함) 결과:
    #          0.5 → 평균 1.61cm    1.5 → 0.73cm    3.0 → 0.46cm
    #      1.5 가 정확도와 여유의 균형점. 경로에 잘 안 붙으면 올리고,
    #      조향이 떨리면 내린다.
    k_e: 1.5
    # k_soft: 저속에서 분모가 0 이 되는 것을 막는다.
    #         없으면 v→0 일 때 조향이 튄다. 0.5 면 충분하다.
    k_soft: 0.5
    k_heading: 1.0          # 헤딩오차 가중. 1.0 이 표준 Stanley

    # ── 곡률 전방보상 ────────────────────────────────────────────────
    #
    #   steer += k_curv · atan(wheelbase · kappa)
    #
    #   곡률 kappa 인 경로를 **유지**하는 데 필요한 조향을 미리 준다.
    #   없으면 곡률 구간에서 횡오차가 0 으로 안 간다 — 그 조향을 오차 항이
    #   만들어내야 해서 평형점이 0 에서 벗어난다.
    #
    #   ■ track_5 실측 (2026-09-30, target_speed 0.7)
    #
    #       k_curv 0     →  평균 횡오차 -4.20 cm
    #       k_curv 1.0   →  평균 횡오차 +8.91 cm   (과보상)
    #       선형 보간    →  0 이 되는 값 ≈ 0.32
    #
    #   ★ 이론값은 1.0 인데 왜 0.32 인가
    #     kappa 추정은 정확하다 (적분 6.282 rad vs 2pi=6.283 로 확인).
    #     Stanley 의 다른 항들이 이미 곡선 조향의 일부를 만들기 때문이다.
    #
    #   ★ 속도를 크게 바꾸면 다시 맞춰야 한다
    #     전방보상 항 자체(atan(L·kappa))는 기하값이라 속도와 무관하지만,
    #     k_curv 는 지금 "나머지 항들과의 균형" 을 맞추는 보정계수다.
    #     그 나머지 항이 속도 의존적이다:
    #         atan2(-k_e·e, k_soft + |v|)  ← v 가 크면 권한이 줄어든다
    #     게다가 고속에서는 타이어 슬립으로 기하값보다 더 꺾어야 한다.
    #     둘 다 "빠를수록 전방보상이 더 필요하다" 는 방향이므로,
    #     속도를 올리면 k_curv 도 올려야 한다.
    #
    #     제대로 하려면 언더스티어 계수를 재서
    #         steer_ff = atan(L·kappa) + K_us · v^2 · kappa
    #     로 바꿔야 한다. 다만 Stanley 는 배관 검증용이고 최종 목표는 MPC 다
    #     — MPC 는 예측 구간에서 곡률을 직접 다루므로 이 문제가 없다.
    #     여기에 과투자하지 말 것.
    k_curv: 0.32

    # ── 경로 ────────────────────────────────────────────────────────
    closed_loop: true

    # ── 안전 ────────────────────────────────────────────────────────
    state_timeout: 0.2
    require_enable: true    # ★ /mpc/enabled=true 를 받아야 출발
    bench: false
    control_rate: 50.0      # Stanley 는 가벼워서 50Hz 로 돌려도 된다
    debug: false
