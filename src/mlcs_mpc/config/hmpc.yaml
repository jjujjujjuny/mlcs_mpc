# ═══════════════════════════════════════════════════════════════════
#  hmpc_node 설정 — 아직 차를 자율로 달리지 않는다 (./drive.sh hmpc 는 bench 다)
# ═══════════════════════════════════════════════════════════════════

/**:
  ros__parameters:

    # ── 속도 상한 ────────────────────────────────────────────────────
    # ★ 저자 비용(-s)에는 속도 제한이 없다. 직선이면 입력 상한까지 간다 (실측 약 7 m/s).
    #   이 값이 OCP 입력 상한이자 노드 출력 상한이다. 첫 주행은 0.7.
    v_max: 0.7
    # 서보 명령 한계. OCP 의 조향 경계는 맵의 끝값(실제 0.378)이다.
    max_steer: 0.40
    max_steer_rate: 3.2
    # 명령 → 실제 조향 (좌우 평균, 1 m/s 원선회 2026-11-05). ±0.40 은 offset 변경 전 측정이다.
    steer_map_cmd: [0.0, 0.2, 0.3, 0.4]
    steer_map_act: [0.0, 0.2021, 0.2972, 0.3776]

    # ── 동역학 파라미터 — 생성 코드를 다시 안 만들고 바꿀 수 있다 ─────
    # 질량만 생성 코드에 들어 있다 (hypermpc/offline_ocp.py 의 MASS 와 같아야 한다).
    mass: 3.284
    friction: 0.41
    # ★ 메인 PC 재동정 H (2026-11-09, 모델 dummy-z3on0r8l). 질량 3.284, 마찰 0.41, lr 고정,
    #   저자 타이어 식 그대로 (뒷바퀴 슬립 lf 포함). 데이터: 11-07 + 11-08 아침 race (제동 꺼짐) ×3
    #   + 제동 켠 뒤 랠리·18:3x 제동 ×3 + 밤 1108_8 레이스 (mocap 정답) ×3. 1초 예측 손실, 이전 값(tb2n) → H:
    #     밤 레이스 0.0158 → 0.0077, 제동 0.0281 → 0.0209, 아침 race 0.0386 → 0.0264, 11-07 test 0.0063 → 0.0054
    #   조향 포화 고속 코너 요레이트 예측/실제 0.98 (마찰 0.41 그대로가 맞다). 이전 값에서 I_z ×1.8, Cd2 ×10.6,
    #   Cd1 ×4.2, 뒷바퀴 Bx 68.6 → 13.9 로 크게 바뀌었다 — 조합으로만 믿을 것. 감속은 아직 1 s 에 0.12 m/s 덜 선다고
    #   본다 (제동 데이터 2 분). 이전 값 (tb2n, 2026-11-05):
    #     vehicle_params: [0.0812, 0.1537, 0.0052, 0.0083, 0.0112, 0.2091, 0.9033, 0.3143, 0.5138, 0.0543]
    #     tire_front: [0.0651, 1.6366, 0.2692, 0.7741, 1.1634, 0.1908, 2.0019, 1.3688, 2.1173, 0.5216]
    #     tire_rear: [0.0655, 1.6272, 0.1274, 0.8129, 1.4332, 1.4027, 68.6373, 1.1428, 1.7137, 0.8273]
    #   I_z, Cd 는 실제 질량 기준이다. offline_ocp.scale_for_mass 가 환산하니 미리 환산하지 말 것.
    #   I_e, K_fi, b1, b0, R 은 저자 naive 식에서 쓰지 않는다 (동정 안 됨, 결과에 영향 없음).
    # I_z, lr, Cd0, Cd2, Cd1, I_e, K_fi, b1, b0, R
    vehicle_params: [0.1439, 0.1537, 0.0041, 0.0879, 0.0473, 0.2200, 0.9062, 0.3263, 0.5251, 0.0597]
    # Sx_p, Alpha_p, By, Cy, Dy, Ey, Bx, Cx, Dx, Ex
    # ★ Cx ≤ 1 로 묶었다 (2026-11-09, Bx·Cx 유지 → 원점 기울기 Bx·Cx·Dx 그대로). 동정값 그대로면 뒷바퀴
    #   Cx 1.86 이라 종방향 힘이 슬립률 0.078 정점 뒤 급히 떨어지고 (σ 1 에서 정점의 1/3), 그 구간에서 v_x
    #   고유값이 양수가 된다 (0.25 m/s +25~47 /s, 0.7 m/s +9 /s). 저속에서는 ws−vx 가 조금만 벌어져도
    #   그 구간이라 젯슨 test_hmpc_node 게이트 (0.7 m/s) 에서 status 4 반복, 풀이 p95 23.9 → 52.6 ms 였다.
    #   묶은 뒤 최악 고유값 +1.7 (tb2n +1.5 와 같은 수준). 1초 예측 손실은 거의 그대로:
    #     밤 레이스 0.00765 → 0.00757, 제동 0.0209 → 0.0195, 아침 race 0.0264 → 0.0262, 11-07 0.0054 → 0.0062
    #   묶기 전 동정값: tire_front Bx 1.3539 Cx 1.5163 / tire_rear Bx 13.9346 Cx 1.8624 (hyper_params.CX_MAX 와 같은 규칙)
    # ★ 종방향 Dx ×0.45 (2026-11-09 밤, Bx ×1/0.45 → 원점 기울기 Bx·Cx·Dx 그대로, 횡방향 그대로).
    #   H 는 급제동 때 바퀴가 역회전하는 구간 (VESC 속도-0 PID, rally 최소 −4.3 m/s) 을 학습에서 못 봤다
    #   (prep 의 ws ≥ 0 조건, 74c7e03 에서 고침). 그 구간에서 모델 잠김 감속 −12.8 vs 실측 −1.3~−2.7 m/s²,
    #   1초 예측 손실이 처음 보는 rally 급제동 0.123 / 1109_4 주행 0.098. ×0.45 로 0.023 / 0.0055.
    #   역회전 구간이 빠진 예전 평가셋은 2~15% 손해. 역회전 포함 재학습 (dummy-8z9f60hq) 보다 나았다 (1109_4 0.0156).
    #   젯슨 offline 1109_4 v2.0/3.0: status 0×900, p95 24.5/25.1 ms, 벽밖 0, 랩 +0.0~0.1 s, ws_ref 급강하 4→2 / 2→0.
    #   잠김 감속 모델 −5.9 (아직 실측의 2~4배). 되돌리려면 앞 Bx 2.0529 Dx 2.8164 / 뒤 Bx 25.9518 Dx 3.5449.
    tire_front: [0.0629, 1.8213, 0.2746, 0.7151, 1.2219, 0.1049, 4.5620, 1.0, 1.2674, 1.3020]
    tire_rear: [0.0634, 1.8083, 0.1022, 0.7395, 1.6569, 3.4561, 57.6707, 1.0, 1.5952, 0.1508]

    # ── OCP ──────────────────────────────────────────────────────────
    N: 60   # 2026-11-06 실차 29.4 Hz, p95 22 ms. N=80 은 노드에서 p95 가 33 ms 를 넘었다. 논문은 80
    dt: 0.033
    # 구간당 RK4 횟수. 1 이면 저속에서 적분이 발산해 solve 가 멈춘다 (hypermpc/offline_ocp.py 머리말).
    # 동정값은 뒤 타이어 Bx 가 커서 3 이면 0.25 m/s 출발에서 QP 실패가 대부분이다. 값이 바뀌면 다시 볼 것.
    rk_steps: 4
    # 액추에이터 1차 시정수. 바꾸면 생성 코드를 다시 만든다 (약 20초, 자동).
    #   조향: 계단 40회에 맞춘 값 (저자 0.044).
    #   바퀴: ★ 저자 값 그대로다. 계단 71회에 맞추면 0.66 s (mocap 속도는 0.56 s) 인데,
    #   0.66 과 0.2~0.35 조합은 곡선에서 QP 실패(status 4)가 대부분이라 못 쓴다 (2026-11-05).
    #   그래서 모델은 실제보다 속도가 훨씬 빨리 붙는다고 믿는다. v_max 를 올리기 전에 볼 것.
    steering_tau: 0.13
    # 트랙 경계. true 면 |n| ≤ track_width 를 상태 경계(하드)로 둔다. false 면 저자처럼 배리어 비용.
    #   ★ 2026-11-08 하드로 바꿈. 라이다 맵 트랙은 최소 곡률선이라 벽까지 여유가 0.25 m 쯤뿐이라,
    #     선에서 ±0.25 m 까지 벗어나던 배리어로는 벽에 닿을 수 있다.
    #   지금 |n| 이 이미 넘었으면 10 스테이지 동안 경계를 그 값에서 줄인다 (offline_ocp.hard_bounds).
    #   바꾸면 생성 코드를 다시 만든다 (약 20초, 자동).
    track_hard: true
    # ★ 2026-11-08 MPCC 로 되돌림: walls = 트랙 파일의 지점별 벽 폭(w_left/w_right) − wall_margin 을 경계로.
    #   선은 좌표계(κ, s, n)일 뿐이고 MPC 가 벽 안에서 스스로 선을 고른다 (maptrack --walls 가 폭을 쓴다).
    #   fixed = 선에서 ±track_width (선에 묶는다. 위치추정이 나쁠 때 썼던 방식)
    track_bounds: walls
    wall_margin: 0.22
    track_width: 0.12
    # 경계를 넘는 양에 거는 L1 무게. 0 이면 순수 하드인데, 차가 폭 안에 못 머무는 순간 QP 해가
    #   없어져 status 4 가 된다 (1108_3 트랙, ±0.12 에서 1000 회 중 940). 1000 이면 전부 status 0,
    #   |n| 최대 0.136 m (1108_3) / 0.121 m (s_track) — 지킬 수 있으면 하드처럼 지킨다.
    track_slack: 1000.0
    # ★ 2026-11-08 0.0461 → 0.4. VESC 제동을 켠 최종 설정에서 실측 0.40~0.45 (tools/actuator_id.py).
    #   예전 '0.66 은 QP 실패' 는 벽 경계(MPCC) 전 이야기다. 지금 정식화에서는 0.4 도 status 0 (오프라인 900 회,
    #   0.1/0.3 m/s 출발 포함). 바퀴 지연을 tau 로 담으면 아래 가속도 한계는 필요 없다.
    wheel_speed_tau: 0.4
    # ★ 바퀴 가속도 한계 m/s² (0 = 끔). 바꾸면 생성 코드를 다시 만든다.
    #   tau 0.046 이면 MPC 는 바퀴가 바로 명령을 따라가 언제든 설 수 있다고 믿는다 → 늦게 감속해
    #   앞 벽에 박았다 (2026-11-08). tau 를 올리면 QP 가 실패하므로 바퀴 가속도만 묶는다
    #   (offline_ocp 의 선형 제약). 값은 tools/actuator_id.py 로 잰다.
    #   11-08 race 로그 (VESC 제동 꺼짐): 가속 2.0 / 감속 1.5 → 바퀴 2 s 예측 RMSE 0.54 → 0.16 m/s
    ws_acc_max: 0.0
    ws_dec_max: 0.0
    # ★ 헤딩 돌출 (2026-11-09): > 0 이면 차체 앞 끝 (무게중심에서 m, 우리 차 0.30) 과 뒤 끝 (0.25) 도
    #   벽 경계 안에 (h 제약). 켜면 wall_margin 은 차 반폭 0.15 + 여유 (0.20~0.23). 0 = 끔 (중심 점만)
    wall_heading: 0.0
    # ★ 경계를 파라미터로: n 경계 (와 헤딩 끝) 를 상자 경계 대신 p 에 넣은 h 제약으로. 주기당 constraints_set
    #   120~240 번이 빠져 ~5 ms 줄고 풀이 시간은 같다 (offline 1109_4 v3.0). wall_heading 을 켤 땐 켤 것
    bounds_param: true
    # ★ 조향 비용 q_delta·(δ_ref − δ)² (저자 2.0). 11-10 실차 ABAB (mocap 1108_7, 각 2번): 3 이면 랩 중앙
    #   5.17 → 5.04 s, 편차 0.12 → 0.06, 직선 조향 전환 −51%, 코너 여유 그대로. 5 는 코너에서 가상 벽 38~50 cm 넘음
    q_delta: 3.0
    # ★ HPIPM 부분 응축 길이 (0 = 기본 N). 11-10 offline 1108_7 v2.0 / 1109_4 v3.0: 10 이면 풀이 p95
    #   24.7 → 20.6 / 23.1 → 20.8 ms, 궤적·랩 완전히 같음 (풀이 방식만 바뀜). SPEED 모드를 더해도 거의 같음,
    #   N 45 는 p95 17 ms 지만 랩 +0.4~0.7 s, SPEED_ABS 는 고속에서 불안정
    qp_cond_n: 10
    # ★ 지연 보상: 상태 측정 시각 → 지금 + 예상 풀이 시간 만큼 그동안 낸 명령으로 x0 를 당긴다 (워커에서 적분).
    #   라이다 센서→명령 60~100 ms. offline 1109_4 v2.0 80 ms 지연: 보상 없음 랩 6.60~7.52 / 벽밖 1.6%,
    #   보상 6.24~6.30 / 0% (2026-11-10). 실차 A/B 전이라 끔
    delay_comp: false
    # 스탬프에 안 보이는 추가 지연 s (라이다 주행이면 race.sh 가 25 ms 로 — 주행별 실측 17~27 ms)
    delay_extra: 0.0
    # 액추에이터 지연 s (조향 명령 → 곡률이 모델보다 늦은 만큼, 실차 66~80 ms). delay_extra 와 더해 앞으로 예측
    act_delay: 0.0
    # ★ 교착 탈출 후진: 1 s 동안 0.1 m 도 못 가고 평균 vx < 0.15 면 sign(μ)·최대 조향으로 1.2 m/s 후진
    #   (최대 0.2 m / 1.2 s, 11-11 절반으로) → MPC 다시. 같은 자리 (1 m 안) 3번이면 고장 래치. 끝난 뒤 1 s 는 교착 판정 안 함. 대회 규칙상 후진 허용 (11-10 확인)
    #   11-11 기본 켬: mocap 실차 11번 모두 성공, 재웅 offline 추월 28 경우 우리 탓 충돌 0 (끄면 1108_7 급커브 5 경우 갇힘)
    recover_reverse: true
    wall_heading_r: 0.25

    # ── HyperPM 시변 파라미터 (2026-11-09) ───────────────────────────
    # .npz (저장소 기준 경로) 를 주면 위 상수 대신 매 주기 네트워크가 스테이지별 파라미터를 낸다
    #   (hypermpc/hyper_params.py, tools/export_hyper.py). 비우면 ('') 상수. 생성 코드는 그대로.
    #   J_ep10 = 11-08 mocap 로그 전부 (dummy-ncr2sxjz 10 에폭). 1초 예측 손실 H → J:
    #     밤 레이스 0.0077 → 0.0055, 제동 0.0209 → 0.0153, 아침 race 0.0264 → 0.0213, 11-07 0.0054 → 0.0029.
    #   실측 라이다 상태 오차를 입력에 넣어도 0.0058 / 0.0164 / 0.0216 (H 보다 여전히 18~30% 낫다).
    #   파라미터는 네트워크 기준값 × [0.5, 1.5] 안에서만 움직인다. 출력이 비정상이면 위 상수를 쓴다.
    #   ★ 실차 전에 offline_ocp --hyper 로 status 4 가 늘지 않는지 볼 것.
    hyper_model: ''
    hyper_v_min: 0.0      # 이 vx 아래는 상수 (0 = 항상 네트워크. MPC 상태 vx 는 v_floor 0.25 아래로 안 내려간다)
    hyper_blend: 0.0      # v_min ~ v_min+blend 에서 상수와 섞는다
    control_rate: 30.0
    track_csv: lab_map/data/tracks/s_track/prep_s_track.csv   # 저장소 기준 경로

    # ── 감시 ─────────────────────────────────────────────────────────
    # 평상시 최대 약 26 ms, 코어를 다 채우면 약 82 ms 까지 봤다 (2026-11-05).
    # 복귀 직후 과도 구간에서 풀이가 70 ms 까지 갔다 (N=80, RK4 4회). 판정 주기 33 ms 를 더해 본다.
    solve_timeout: 0.15
    # 재시작 첫 풀이와 slow_speed 아래에서의 제한. 출발 직후 풀이가 최대 약 110 ms 까지 갔다 (실측).
    restart_timeout: 0.5
    slow_speed: 0.4
    max_bad_solves: 3
    state_timeout: 0.2
    vesc_timeout: 0.3
    # 부하 측정에서 33 ms 를 넘은 것은 코어를 빼앗겼을 때다. 솔버를 이 코어에 묶는다.
    solver_core: 5

    # ── 상대 차 (추월·뒤따르기, mlcs_mpc/opponent.py) ──────────────────
    # 비우면 끈다. mocap 이면 상대 RigidBody 의 PoseStamped (예: /car2/pose), 시뮬이면 opp_odom + odom.
    # ★ 상대 pose 는 트랙과 같은 좌표계여야 한다 (mocap 주행 = *_mocap 트랙).
    # 상대 옆 통로로 스테이지별 n 경계를 좁혀 추월하고, 양쪽이 막히면 바퀴 속도 상한으로 뒤따른다.
    # 처음엔 학습 없이 예측하고, 상대를 한 바퀴 거의 다 보면 상대 라인·속도를 GP 로 맞춰 쓴다.
    # 여기 없는 opp_* 값은 OppParams 기본값이다 (opponent.py).
    opponent_topic: ''
    opponent_msg: pose
    # 두 차 중심 사이 최소 횡거리 m (차 폭 약 0.30 + 여유). 1108_7 트랙(폭 중앙값 1.18 m)에서는 상대가
    #   벽 쪽에 붙어 있어야 추월 통로가 나온다 (offline 간이 시험: d −0.28 이면 추월, 0 이면 뒤따름)
    opp_clear: 0.40
    # 앞뒤로 이 안이면 겹친다고 본다 m (차 길이 약 0.55 + 여유)
    opp_length: 0.70
    # 상대 횡 불확실성 ½ a_y t² 와 그 상한 m. 상한을 키우면 먼 스테이지가 막혀 추월이 거의 안 된다
    opp_a_y: 1.0
    opp_d_cap: 0.15
    # 뒤따를 때 목표 간격 (s 차이) m. 옆 자리는 있는데 못 가서 뒤따를 때는 빠질 거리만큼 더 둔다
    opp_trail_gap: 0.80
    # 도달 가능성 (2026-11-08 젯슨 실제 솔버 시험 뒤): 통로는 달린 거리 Δs 안에 옆으로 갈 수 있어야 고른다.
    #   y(Δs) = 곡률 opp_reach_kappa 로 헤딩 opp_reach_heading 까지 틀고 직진. 고속은 곡률을 a_lat/v² 로 줄인다
    opp_reach_kappa: 1.0
    opp_reach_heading: 0.5
    # 판단할 때 우리 진행 속도 하한 m/s. 장애물 뒤에 서 있어도 다시 옆 통로를 본다
    opp_pass_speed: 0.8
    opp_gp: true
    # 상대 위치 측정 표준편차 m. mocap 0.01, 라이다 검출로 바꾸면 0.05~0.1
    opp_meas_noise: 0.01
