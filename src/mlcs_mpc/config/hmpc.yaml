# ═══════════════════════════════════════════════════════════════════
#  hmpc_node 설정 — 아직 차를 자율로 달리지 않는다 (./drive.sh hmpc 는 bench 다)
# ═══════════════════════════════════════════════════════════════════

/**:
  ros__parameters:

    # ── 속도 상한 ────────────────────────────────────────────────────
    # ★ 저자 비용(-s)에는 속도 제한이 없다. 직선이면 입력 상한까지 간다 (실측 약 7 m/s).
    #   이 값이 OCP 입력 상한이자 노드 출력 상한이다. 첫 주행은 0.7.
    v_max: 0.7
    # 서보 명령 한계. OCP 의 조향 경계는 맵의 끝값(실제 0.378)이다.
    max_steer: 0.40
    max_steer_rate: 3.2
    # 명령 → 실제 조향 (좌우 평균, 1 m/s 원선회 2026-11-05). ±0.40 은 offset 변경 전 측정이다.
    steer_map_cmd: [0.0, 0.2, 0.3, 0.4]
    steer_map_act: [0.0, 0.2021, 0.2972, 0.3776]

    # ── 동역학 파라미터 — 생성 코드를 다시 안 만들고 바꿀 수 있다 ─────
    # 질량만 생성 코드에 들어 있다 (hypermpc/offline_ocp.py 의 MASS 와 같아야 한다).
    mass: 3.284
    friction: 0.41
    # I_z, lr, Cd0, Cd2, Cd1, I_e, K_fi, b1, b0, R
    vehicle_params: [0.089, 0.1537, 0.01, 0.01, 0.01, 0.2, 0.90064745, 0.304115174, 0.50421894, 0.05]
    # ★ 타이어는 아직 저자 기본값이다. 메인 PC 재동정이 끝나면 여기를 바꾸고
    #   풀이 시간을 다시 잰다 (첫 동정값은 질량 3.097 기준이라 쓰지 말 것).
    # Sx_p, Alpha_p, By, Cy, Dy, Ey, Bx, Cx, Dx, Ex
    tire_front: [0.05, 2.0, 0.35, 1.4, 1.0, 1.2, 30.0, 1.3, 1.0, 0.5]
    tire_rear: [0.05, 2.0, 0.35, 1.4, 1.0, 1.2, 30.0, 1.3, 1.0, 0.5]

    # ── OCP ──────────────────────────────────────────────────────────
    N: 80
    dt: 0.033
    # 구간당 RK4 횟수. 1 이면 저속에서 적분이 발산해 solve 가 멈춘다 (hypermpc/offline_ocp.py 머리말).
    rk_steps: 3
    # 액추에이터 1차 시정수. 바꾸면 생성 코드를 다시 만든다 (약 20초, 자동).
    #   조향: 계단 40회에 맞춘 값 (저자 0.044).
    #   바퀴: ★ 저자 값 그대로다. 계단 71회에 맞추면 0.66 s (mocap 속도는 0.56 s) 인데,
    #   0.66 과 0.2~0.35 조합은 곡선에서 QP 실패(status 4)가 대부분이라 못 쓴다 (2026-11-05).
    #   그래서 모델은 실제보다 속도가 훨씬 빨리 붙는다고 믿는다. v_max 를 올리기 전에 볼 것.
    steering_tau: 0.13
    wheel_speed_tau: 0.0461
    control_rate: 30.0
    track_csv: lab_map/data/tracks/s_track/prep_s_track.csv   # 저장소 기준 경로

    # ── 감시 ─────────────────────────────────────────────────────────
    # 평상시 최대 약 26 ms, 코어를 다 채우면 약 82 ms 까지 봤다 (2026-11-05).
    solve_timeout: 0.1
    max_bad_solves: 3
    state_timeout: 0.2
    vesc_timeout: 0.3
    # 부하 측정에서 33 ms 를 넘은 것은 코어를 빼앗겼을 때다. 솔버를 이 코어에 묶는다.
    solver_core: 5
