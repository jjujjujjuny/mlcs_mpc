# ═══════════════════════════════════════════════════════════════════
#  시뮬레이터 차의 저수준 제어기 (env/lowlevel.py) — ODE 시뮬레이터만 쓴다 (MPC 모델은 config/mpcc.yaml).
#  /drive 목표 → 명령 지연 → 저수준 (조향 각속도·바퀴 가속도) → 차 동역학 RK4 1 ms.
#  main.py / main_sim.py / sim_node 가 기본으로 읽고, --lowlevel KEY=VALUE (none = 예전 식) 로 덮어쓴다.
#  wheel_model vesc 이면 속도 법칙 (speed_model, kp_*, acc_max, dec_max, v_switch) 대신 VESC 펌웨어 모델을 쓴다.
# ═══════════════════════════════════════════════════════════════════
lowlevel:
  # ── 조향 (서보) ──────────────────────────────────────────────────
  steer_model: lag      # lag = 1차 지연 (τ = steer_tau) | gym = f1tenth_gym 뱅뱅
  steer_tau: 0.005      # s 시뮬 차 서보 (2026-11-27): 1 차 지연은 거의 없애고 아래 각속도 상한 + 지연으로 낸다.
                        #   0 이면 mpcc.yaml steering_tau (0.13, MPC 모델 값) 를 쓴다.
                        #   근거 ① 거치대 계단 (11-26, 젯슨 servo_step_20261126.json): 지연 40~60 ms + 상한 2.0~2.5 rad/s 가 가장 맞음
                        #        (기록 50 Hz·mocap 전달 지연이 섞여 지연은 ±20 ms)
                        #   근거 ② 땅 위 개루프 재생 (실차 /drive 를 도착 시각대로 → 1 s 뒤 위치·헤딩, f 0.41):
                        #        설정            11-10 (뒤축, 612 창)   11-26 (앞축→뒤축, 1473 창)
                        #        τ 0.03           5.0 cm  3.8°           6.4 cm  3.3°
                        #        τ 0.13           8.9 cm  7.9°           6.8 cm  6.1°
                        #        20 ms + 2.5      5.6 cm  4.0°           6.5 cm  3.4°   ← 지금 값
                        #        40 ms + 2.2      6.2 cm  5.1°           6.4 cm  3.9°
                        #        60 ms + 2.2      6.5 cm  6.1°           6.4 cm  4.5°
                        #   → 상한 2.5 는 거치대 그대로, 지연은 땅 위에서 20 ms 보다 길면 나빠져 20 ms.
                        #   MPC 모델 steering_tau 를 같이 줄일지는 실차 확인 뒤 (재빌드 — 시뮬 차만 바꾸면 모델 불일치 시험이 된다)
  steer_rate: 2.5       # rad/s 서보 최대 각속도 (0 = 없음). 거치대 2.0~2.5 (노드 명령 변화율 묶음 3.2 보다 느림)
  steer_delay: 0.02     # s 서보 순수 지연. MPC 풀이 지연은 main.py --realtime / --delay / ROS 에서 따로 낸다

  # ── 속도 (lag 바퀴) ──────────────────────────────────────────────
  speed_model: lag      # lag = 1차 지연 (τ = wheel_speed_tau 0.4, 실측 0.40~0.45) | gym = P 제어
  acc_max: 5.23         # m/s² VESC 가속 램프 s_pid_ramp_erpms_s 25000 / erpm gain 4781.5 (MPC 모델에는 없다)
  dec_max: 0.0          # m/s² 0 이면 mpcc.yaml ws_dec_max (실측 2.5) 를 쓴다
  v_switch: 0.0
  speed_delay: 0.0      # s

  # ── 속도 환산 ────────────────────────────────────────────────────
  speed_scale: 1.044    # 실제 속도 / erpm 환산 속도 (실차 실측 — 환산보다 4.4 % 빠르다)
