# ═══════════════════════════════════════════════════════════════════
#  레이스 설정 — 숫자를 고치고 저장한 뒤  ./race.sh
#
#  여기 없는 값은 src/mlcs_mpc/config/hmpc.yaml 을 따른다.
#  ★ 대회 확정 (11-11): hmpc.yaml 기본 = 지금까지 가장 좋았던 설정 (11-10 실차 기준 랩 5.12 s)
#    q_delta 3, qp_cond_n 10, bounds_param, 교착 탈출 후진 켬, 지연 보상 끔, 헤딩 제약 끔.
#    비교용 race_mocap*.yaml 은 지웠다 (dc07 = act_delay 0.07 은 5.67 s 로 가장 나빴다).
#  ★ 표시가 붙은 값은 바꾸면 생성 코드를 다시 만든다 (첫 실행 약 20초, 자동).
# ═══════════════════════════════════════════════════════════════════

# 위치를 어디서 받나. lidar = Cartographer 위치추정 (대회), mocap = 연구실 mocap.
source: lidar
# 라이다로 달릴 때 쓸 맵 (maps/<이름>.pbstream). 맵핑을 시작한 자리·방향 근처에서 출발한다.
map: "1108_7"        # ★ 따옴표 필수 — 1108_5 는 YAML 에서 숫자 11085 가 된다

# 트랙 이름 (lab_map/data/tracks/<이름>/) 또는 prep csv 경로.
#   lidar 면 그 맵에서 만든 트랙 (./drive.sh maptrack <맵>), mocap 이면 *_mocap 트랙.
track: "1108_7_track"

# false = bench (속도 항상 0, 조향만). true = 실제로 달린다.
drive: false

# 기록 태그. 비우면 ('') 기록하지 않는다. → ~/mlcs_data/drive_<시각>_<태그>.csv
log: race

# 장애물: off = 끔, watch = 찾기만 (RViz 로 확인, MPC 는 안 피함), lidar = 찾아서 피한다.
#   source: lidar 에서만.
#   저장한 맵과 비교해 '맵에 없는 것' 을 찾는다 (lidar_obstacles). 맵핑 뒤 트랙이 바뀌면 그것도 장애물로 보인다.
#   회피·뒤따름 로직 (opponent.py) 은 재웅 offline 28 경우 우리 탓 충돌 0 (11-11). 실차는 처음엔 v_max 1.0 에서.
obstacles: off

# 위치추정 오도메트리 (source: lidar 에서만): off = 스캔만 (지금까지), ekf = 바퀴 속도 ×1.042 + 자이로로
#   Cartographer 가 다음 위치를 예측 (wheel_odom, localization_2d_odom.lua). 긴 직선 앞뒤 미끄러짐 대책
loc_odom: off

hmpc:
  # ── 속도 ─────────────────────────────────────────────────────────
  v_max: 2.0            # m/s. 0.7 에서 시작해 0.2 씩. 상한은 모터 (vesc.yaml speed_max, 약 4.86). MPC 가 코너에서 알아서 감속한다
  friction: 0.41        # ★ 모델 접지력. 0.41 (실측·기본)으로 되돌림 (11-08 밤).
                        #   메인 PC: 밤 레이스를 mocap 정답으로 보면 조향 포화 창 374개에서 요레이트 비(예측/실제)
                        #   0.41 → 1.00, 0.30 → 0.91, 0.27 → 0.87. 젯슨이 0.30 을 정한 근거(오후)는 라이다 상태 +
                        #   명령 조향 + 정상상태 비교라 틀렸다. 오프라인 (1108_8, 차 0.41): MPC 0.41 벽 밖 0.7%,
                        #   0.30 1.7%, 0.27 2.0%. 바깥 치우침의 원인은 마찰이 아닌 다른 곳 (조향 맵, 위치 지연 등)

  # ── 트랙 경계 ────────────────────────────────────────────────────
  track_bounds: walls   # walls = 벽 안에서 MPC 가 선을 고른다 (MPCC). fixed = 선에서 ±track_width 로 묶음
  wall_margin: 0.28     # walls: 벽에서 이만큼 떨어져야 벌점 없음 m (차 반폭 0.15 + 여유)
  track_width: 0.12     # fixed 일 때만: 선에서 벗어나도 벌점 없는 거리 m
  track_slack: 1000.0   # ★ 경계를 넘은 양의 벌점. 작으면 더 쉽게 넘는다 (넘어도 멈추지는 않음)
  track_hard: true      # ★ false 면 저자처럼 배리어 비용 (경계 대신)

  # ── 예측 구간 ────────────────────────────────────────────────────
  N: 60                 # ★ 스테이지 수. 늘리면 멀리 보지만 느려진다 (80 이면 p95 33 ms 넘음)
  rk_steps: 4           # ★ 스테이지당 RK4 횟수. 줄이면 저속에서 solve 가 멈출 수 있다

  # ── 액추에이터 모델 ──────────────────────────────────────────────
  steering_tau: 0.13    # ★ 조향 1차 시정수 s (계단 응답 실측)
  wheel_speed_tau: 0.4  # ★ 바퀴 속도 시정수 s. 최종 VESC 설정(제동 켬) 실측 0.40~0.45 (actuator_id, 11-08 20:2x)
                        #   오프라인 (1108_6, v_max 2.5, 차 바퀴 tau 0.4): 0.0461 이면 벽 밖 8.4%, 0.4 면 0.7%
                        #   QP 는 900 회 모두 status 0, 0.1·0.3 m/s 출발도 정상. 바꾸면 생성 코드 재빌드 (~20 s)
  ws_acc_max: 0.0       # ★ 바퀴 가속도 한계 m/s² (0 = 끔). tau 가 실제와 맞으면 더할 게 없다 (같은 결과)
  ws_dec_max: 2.5       # ★ 바퀴 감속도 한계 m/s² (0 = 끔). 11-09 켬: 모델(H)은 바퀴 잠김 감속을 -12.8 m/s² 로
                        #   믿지만 실차(1109_3, mocap)는 중앙값 -1.3, p10 -2.7. 끄면 MPC 가 코너 직전 4.0→0.01
                        #   급제동 → 바퀴 잠김 → 미끄러져 벽. 메인 PC 가 종방향 타이어를 재동정하면 다시 볼 것

  # ── 동역학 모델 ──────────────────────────────────────────────────
  hyper_model: ''       # '' = 상수 파라미터 (hmpc.yaml, 재동정 H). HyperPM 시변 파라미터를 쓰려면
                        #   "src/mlcs_mpc/config/hyper/J_ep10.npz". 1초 예측 오차 20~45% 작다 (mocap 평가).
                        #   ★ 처음엔 offline_ocp --hyper 로 확인하고 낮은 v_max 에서 H 와 번갈아 비교할 것

  # ── 감시 ─────────────────────────────────────────────────────────
  solve_timeout: 0.15   # 이보다 답이 늦으면 솔버 고장으로 차를 세운다 s

  # ── 상대 차 (추월·뒤따르기) ─────────────────────────────────────────
  opponent_topic: ''    # 비우면 끔. mocap 주행에서 상대 RigidBody PoseStamped (예: "/car2/pose")
                        #   ★ 트랙과 같은 좌표계여야 한다 — 지금은 source: mocap + *_mocap 트랙에서만
  opp_clear: 0.40       # 두 차 중심 사이 최소 횡거리 m. 줄이면 추월이 잦아지고 가까이 붙는다
  opp_trail_gap: 0.80   # 뒤따를 때 목표 간격 m
